<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Admin Console — Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

<div id="toasts"></div>

<!-- ========== UNAUTHORIZED ========== -->
<section id="unauthorized" class="hidden">
  <div class="admin-login-wrap"><div class="admin-blocked card" style="padding:2.4rem 2rem">
    <div class="shield"><i data-lucide="shield-x"></i></div>
    <h2 style="font-size:1.3rem">Unauthorized Access</h2>
    <p style="color:var(--ink-2);font-size:.88rem;margin:.6rem 0 1.4rem">
      Your account does not hold the <b>admin</b> role. Administrative controls were not loaded.</p>
    <a class="btn btn-ghost" href="/index.html">Return to Wallet App</a>
  </div></div>
</section>

<!-- ========== LOGIN GATE ========== -->
<section id="gateLogin" class="hidden">
  <div class="admin-login-wrap"><div style="width:min(400px,100%)">
    <div style="display:flex;align-items:center;gap:.6rem;justify-content:center;margin-bottom:1.4rem">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="#101725"/><path d="M12 6.8v10.4M9 9.4c0-.9 1.3-1.6 3-1.6s3 .7 3 1.6-1.1 1.3-3 1.7-3 .8-3 1.7 1.3 1.6 3 1.6 3-.7 3-1.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
      <b style="font-size:1.15rem;font-family:var(--font-disp)">Nova Admin</b>
    </div>
    <div class="card" style="padding:1.4rem">
      <div class="form-error" id="admErr"></div>
      <div class="field-row"><label class="input-label">Mobile or Email</label><input class="input" id="admId" placeholder="Admin identifier"></div>
      <div class="field-row"><label class="input-label">Password</label>
        <div class="input-wrap"><input class="input" id="admPw" type="password" placeholder="••••••••">
        <button class="pw-toggle" data-pw="admPw"><i data-lucide="eye"></i></button></div></div>
      <button class="btn" id="admLogin">Access Console</button>
    </div>
    <p class="disclaimer">Operators manage a fictional ledger. No real customer funds, UPI rails or banks are involved.</p>
  </div></div>
</section>

<!-- ========== CONSOLE ========== -->
<section id="console" class="hidden">
  <div class="mobile-brandbar">
    <button class="icon-btn hamburger" id="hamBtn"><i data-lucide="menu"></i></button>
    <b style="font-family:var(--font-disp)">Nova Admin</b>
  </div>
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" fill="#101725"/><path d="M12 6.8v10.4M9 9.4c0-.9 1.3-1.6 3-1.6s3 .7 3 1.6-1.1 1.3-3 1.7-3 .8-3 1.7 1.3 1.6 3 1.6 3-.7 3-1.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        Nova Admin
      </div>
      <nav class="side-nav">
        <button class="side-item active" data-a="dash"><i data-lucide="layout-dashboard"></i>Dashboard</button>
        <button class="side-item" data-a="users"><i data-lucide="users"></i>Users</button>
        <button class="side-item" data-a="wallets"><i data-lucide="vault"></i>Wallet Management</button>
        <button class="side-item" data-a="withdrawals"><i data-lucide="banknote-arrow-down"></i>Withdrawals</button>
        <button class="side-item" data-a="txs"><i data-lucide="receipt-text"></i>Transactions</button>
        <button class="side-item" data-a="notifs"><i data-lucide="bell-plus"></i>Notifications</button>
        <button class="side-item" data-a="anns"><i data-lucide="megaphone"></i>Announcements</button>
        <button class="side-item" data-a="settings"><i data-lucide="settings"></i>Settings</button>
      </nav>
      <div style="padding:.5rem">
        <div style="font-size:.72rem;color:var(--ink-3);margin-bottom:.6rem" id="admWho">Signed in as —</div>
        <a class="btn btn-ghost btn-sm" href="/index.html" style="width:100%">Open Wallet App</a>
        <button class="btn btn-danger btn-sm" id="admLogout" style="width:100%;margin-top:.4rem">Log Out</button>
      </div>
    </aside>
    <main class="admin-main" id="admMain"></main>
  </div>
</section>

<div id="modalRoot"></div>
<script src="admin.js"></script>
</body>
</html>
